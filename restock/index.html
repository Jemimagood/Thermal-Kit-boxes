<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kit Box Restock · Thermal Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#fff;--tile:#f2f4f7;--fg:#0f1a2b;--muted:#5d6878;--line:#d9dee6;--blue:#3b66a1;--blue-ink:#fff;--blue-soft:#e8eef6;--tag:#24497e;--blue-deep:#22406b;--warn:#9a3412;
--display:"Archivo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0d131d;--tile:#17202d;--fg:#e8edf5;--muted:#9aa6b8;--line:#2a3545;--blue:#86a8d8;--blue-ink:#0b1626;--blue-soft:#1a2738;--tag:#b3c9e8;--blue-deep:#2b4b78;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));max-width:1320px;margin:0 auto}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px;white-space:nowrap}
.brand span{color:var(--blue)}
.sp{flex:1}
.hbtn{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);padding:0 14px;height:42px;font-weight:500;white-space:nowrap}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn .n{font-family:var(--mono);font-size:12px;background:var(--blue);color:var(--blue-ink);padding:0 6px;min-width:20px;text-align:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border-bottom:2.5px solid transparent;padding:10px 12px 9px;white-space:nowrap;color:var(--muted);font-weight:500}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--blue)}
.tab .c{font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--muted)}
.tabsep{width:1px;background:var(--line);margin:8px 6px;flex:none}
/* heading */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 18px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb button{color:var(--blue);text-decoration:underline}
h1{font-weight:700;font-size:clamp(32px,6vw,60px);line-height:.95;margin:0;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
.headr{display:flex;gap:8px;align-items:center;color:var(--muted)}
.count{font-family:var(--mono);font-size:12px}
.pill{border:1px solid var(--fg);padding:8px 12px;font-weight:500;font-size:13px}
.pill:hover{border-color:var(--blue);color:var(--blue)}
/* layout */
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-bottom:120px}
aside.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:120px;align-self:start}
.group{border:1px solid var(--fg)}
.group .gt{padding:9px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.lyr{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left;color:var(--muted);border-left:3px solid transparent}
.lyr:hover{color:var(--fg)}
.lyr[aria-current="true"]{color:var(--fg);border-left-color:var(--blue);background:var(--blue-soft)}
.lyr .L{font-family:var(--mono);font-size:11px;background:var(--fg);color:var(--bg);min-width:26px;text-align:center;padding:2px 4px}
.lyr[aria-current="true"] .L{background:var(--blue);color:var(--blue-ink)}
.lyr .t{flex:1;min-width:0;line-height:1.25}
.lyr .c{font-family:var(--mono);font-size:11px}
.lyr .c.on{color:var(--blue);font-weight:500}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
.note button{color:var(--muted);text-decoration:underline;font-size:12px}
/* section head + grid */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1.5px solid var(--fg);padding-bottom:8px;margin-bottom:16px}
.sechead h2{font-size:22px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.sechead .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 14px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{position:relative;aspect-ratio:1/1.05;width:100%;background:var(--tile);display:grid;place-items:center;border:2px solid transparent}
.tile svg{width:62%;height:62%;transition:transform .35s ease}
.tile:hover svg{transform:scale(1.05)}
.card.sel .tile{border-color:var(--blue);background:var(--blue-soft)}
.badge{position:absolute;top:12px;left:12px;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 7px}
.card.sel .badge{background:var(--blue);color:var(--blue-ink)}
.fill{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--bg);padding:3px 7px}
.card.sel .fill{color:var(--tag)}
.meta{display:flex;gap:8px;align-items:flex-start}
.meta .t{flex:1;min-width:0}
.name{font-weight:600;font-size:14px;margin:1px 0 3px;line-height:1.3}
.pn{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.flag{font-size:11px;color:var(--warn);font-weight:600;margin-top:3px}
.acts{display:flex;gap:6px;flex:none}
.rnd{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;text-decoration:none;transition:background .2s}
.go{background:var(--tile);color:var(--fg)}
.go:hover{background:var(--blue-soft);color:var(--tag)}
.add{background:var(--fg);color:var(--bg);position:relative}
.add:hover{background:var(--blue);color:var(--blue-ink)}
.add .q{position:absolute;top:-4px;right:-4px;background:var(--blue);color:var(--blue-ink);font-family:var(--mono);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.minus{background:var(--tile);color:var(--fg)}
.minus:hover{background:var(--blue-soft)}
.card.addnew .tile{border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-weight:600}
.editing .card:not(.addnew) .tile{border:1.5px dashed var(--warn)}
/* kit home */
.kitwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;padding-bottom:120px}
.layers{border-top:1.5px solid var(--fg)}
.layer{display:grid;grid-template-columns:44px minmax(0,1fr) auto 18px;gap:16px;align-items:center;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left}
.layer:hover{background:var(--tile)}
.layer .L{width:44px;height:44px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:20px}
.layer .L.sm{font-size:10px;font-family:var(--mono)}
.layer b{display:block;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.layer small{font-size:12px;color:var(--muted)}
.layer small.on{color:var(--blue);font-weight:600}
.layer .thumbs{display:flex;gap:4px}
.layer .thumbs span{width:38px;height:38px;background:var(--tile);display:grid;place-items:center}
.layer .thumbs svg{width:80%;height:80%}
.layer .ar{color:var(--muted)}
.po{position:sticky;top:130px;align-self:start;background:var(--tile);padding:18px}
.po svg{width:100%;display:block}
.pk{cursor:pointer}.pk:hover .pkb{fill:var(--blue-deep)}
.pocap{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}
.steplabel{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--fg);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tray .in{display:flex;align-items:center;gap:12px;padding-block:12px}
.tray .count2{font-weight:700;font-size:28px;line-height:1;color:var(--blue)}
.tray .lbl{font-size:12px;color:var(--muted);line-height:1.3}
.btn{height:44px;padding:0 18px;font-weight:600;font-size:13.5px;border:1.5px solid var(--fg);background:var(--bg)}
.btn.pri{background:var(--fg);color:var(--bg)}
.btn.pri:hover{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn:disabled{opacity:.3;cursor:default}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(15 26 43 / .4);display:none;align-items:flex-end;justify-content:center;z-index:9}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:min(760px,100%);max-height:88vh;padding:22px 24px calc(22px + env(safe-area-inset-bottom));overflow:auto;border-top:3px solid var(--blue)}
.sheet h2{margin:0 0 4px;font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em}
.sheet .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.grp{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:18px 0 2px;border-bottom:1.5px solid var(--fg);padding-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .ic{width:44px;height:44px;background:var(--tile);display:grid;place-items:center;flex:none}
.row .ic svg{width:80%;height:80%}
.row .tx{flex:1;min-width:0}
.row .s{font-family:var(--mono);font-weight:500;font-size:14px}
.row .n{font-size:12.5px;color:var(--muted)}
.row a{padding:9px 12px;border:1px solid var(--fg);text-decoration:none;color:var(--fg);font-weight:600;font-size:12.5px;white-space:nowrap}
.row a.vis{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.stepper{display:flex;align-items:center;border:1px solid var(--line)}
.stepper button{width:38px;height:38px;font-size:18px;font-weight:600}
.stepper input{width:44px;text-align:center;border:0;font:500 15px var(--mono);background:transparent;color:var(--fg)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}
label.f{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.1em}
.inp{width:100%;height:46px;border:1.5px solid var(--fg);padding:0 12px;font:500 16px var(--display);background:var(--bg);color:var(--fg)}
.inp.mono{font-family:var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.danger{color:#b91c1c!important;border-color:#b91c1c!important}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (max-width:900px){.kitwrap{grid-template-columns:1fr}.po{position:static;order:-1;max-width:340px}.layer .thumbs{display:none}.layer{grid-template-columns:44px 1fr 18px}}
@media (max-width:760px){.main{grid-template-columns:1fr}aside.rail{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tray .lbl{display:none}.brand small{display:none}}
</style>
</head>
<body>

  <div class="bar">

    <div class="sp"></div>
    <button class="hbtn" id="hSend">Order list <span class="n" id="hN">0</span></button>

</div></header>
<main class="wrap" id="view"></main>
<div class="tray" id="tray" hidden><div class="wrap in">

  <button class="btn" id="nextBtn">Next layer ›</button>
  <button class="btn pri" id="sendBtn">Review &amp; send</button>
</div></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700)};
let S,editing=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function boot(){
  const kits=JSON.parse(JSON.stringify(KITS));
  kits.forEach(k=>k.boxes.forEach(b=>b.items.forEach(it=>{it.id=uid();it.min=Math.max(1,Math.floor(it.qty/2))})));
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!S||!S.kits)S={kits,kit:0,box:0,view:'home',sel:{},opened:{}};
  window.addEventListener('hashchange',fromHash);fromHash(true);
}
const kit=()=>S.kits[S.kit],box=()=>kit().boxes[S.box];
function fromHash(first){
  const m=location.hash.slice(1).match(/^k(\d)(?:-([a-z]+))?$/i);
  if(m){S.kit=Math.min(+m[1],S.kits.length-1);if(m[2]){const i=kit().boxes.findIndex(b=>b.L.toLowerCase()==m[2].toLowerCase());if(i>=0){S.box=i;S.view='box'}}else S.view='home'}
  else if(!first)S.view='home';
  render();
}
function go(view,i){S.view=view;if(i!=null)S.box=i;const h='k'+S.kit+(view=='box'?'-'+box().L.toLowerCase():'');if(location.hash.slice(1)!=h)location.hash=h;else render();scrollTo(0,0)}
const selIn=b=>b.items.filter(it=>S.sel[it.id]).length;
const kitSel=()=>{const o=[];kit().boxes.forEach(b=>b.items.forEach(it=>{if(S.sel[it.id])o.push({b,it,q:S.sel[it.id]})}));return o};
const total=k=>k.boxes.reduce((a,b)=>a+b.items.length,0);
const sku=it=>it.sku||it.name.toUpperCase();
const nosku=it=>/\s/.test(sku(it));

function packout(k){const n=k.boxes.length,x=10,w=300;let y=34;const P=[];
 P.push(`<rect x="${x+90}" y="4" width="120" height="10" rx="5" fill="#0f1a2b"/><rect x="${x+96}" y="12" width="8" height="24" fill="#0f1a2b"/><rect x="${x+196}" y="12" width="8" height="24" fill="#0f1a2b"/>`);
 k.boxes.forEach((b,i)=>{const tall=i==n-1&&n>3,h=tall?104:i==0?58:66,c=selIn(b),cy=y+h/2;
  P.push(`<g class="pk" data-open="${i}"><rect class="pkb" x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#22406b"/><rect x="${x}" y="${y}" width="${w}" height="8" rx="4" fill="#3b66a1"/>
  <rect x="${x+12}" y="${y+14}" width="10" height="${h-26}" rx="2" fill="#0f1a2b"/><rect x="${x+w-22}" y="${y+14}" width="10" height="${h-26}" rx="2" fill="#0f1a2b"/>
  <rect x="${x+44}" y="${cy-14}" width="${w-88}" height="28" fill="#fff"/><rect x="${x+44}" y="${cy-14}" width="34" height="28" fill="#0f1a2b"/>
  <text x="${x+61}" y="${cy+5}" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="${b.L.length>2?9:15}" fill="#fff">${esc(b.L)}</text>
  <text x="${x+86}" y="${cy+4}" font-family="Archivo" font-weight="600" font-size="10" fill="#0f1a2b">${esc((b.t.length>24?b.t.slice(0,23)+'…':b.t).toUpperCase())}</text>
  ${c?`<circle cx="${x+w-6}" cy="${y+6}" r="11" fill="#3b66a1" stroke="#fff" stroke-width="2"/><text x="${x+w-6}" y="${y+10}" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#fff">${c}</text>`:''}</g>`);y+=h+4});
 if(n>3)P.push(`<circle cx="${x+40}" cy="${y+8}" r="14" fill="#0f1a2b"/><circle cx="${x+40}" cy="${y+8}" r="5" fill="#5d6878"/><circle cx="${x+w-40}" cy="${y+8}" r="14" fill="#0f1a2b"/><circle cx="${x+w-40}" cy="${y+8}" r="5" fill="#5d6878"/>`);
 return `<svg viewBox="0 0 320 ${y+26}" role="img" aria-label="${esc(k.name)} pack-out box">${P.join('')}</svg><div class="pocap">Tap a box to open that layer</div>`}

function renderTabs(){
  $('tabs').innerHTML=S.kits.map((k,i)=>`<button class="tab" role="tab" aria-selected="${i==S.kit}" data-kit="${i}">${esc(k.name)}<span class="c">${total(k)}</span></button>`).join('');
  const n=kitSel().length;$('hN').textContent=n;$('hSend').disabled=!n;
}
function renderHome(){
  const k=kit(),n=kitSel().length;
  $('view').innerHTML=`<div class="head"><div><div class="crumb">Kit boxes · ${esc(k.name)}</div><h1>${esc(k.name).replace(' / ',' <em>/</em> ')}<br>Kit Box</h1></div>
   <div class="headr"><span class="count">${k.boxes.length} layers · ${total(k)} items</span>${n?`<button class="pill" data-review>${n} checked · review ›</button>`:''}</div></div>
  <div class="kitwrap"><div><div class="steplabel">Layers</div><div class="layers">${k.boxes.map((b,i)=>{const c=selIn(b);
   return `<button class="layer" data-open="${i}"><span class="L ${b.L.length>2?'sm':''}">${esc(b.L)}</span>
    <span><b>${esc(b.t)}</b><small class="${c?'on':''}">${c?c+' of '+b.items.length+' checked':b.items.length+' items'}</small></span>
    <span class="thumbs">${b.items.slice(0,4).map(it=>`<span>${art(it.art)}</span>`).join('')}</span><span class="ar">›</span></button>`}).join('')}</div>
   <p class="note" style="margin-top:16px">Tap a layer, tap each item that's low, then send the list to the Thermal webstore or your branch.</p></div>
   <div class="po">${packout(k)}</div></div>`;
}
function renderBox(){
  const k=kit(),b=box();
  $('view').innerHTML=`<div class="head"><div><div class="crumb"><button data-home>${esc(k.name)} kit</button> › Layer ${esc(b.L)}</div><h1><em>${esc(b.L)}</em> · ${esc(b.t)}</h1></div>
   <div class="headr">${editing?'':`<button class="pill" id="allBtn">${b.items.some(it=>S.sel[it.id])?'Clear layer':'Fill whole layer'}</button>`}</div></div>
  <div class="main ${editing?'editing':''}"><aside class="rail"><div class="group"><div class="gt">${esc(k.name)} layers</div>
   ${k.boxes.map((x,i)=>{const n=selIn(x);return `<button class="lyr" data-b="${i}" aria-current="${i==S.box}"><span class="L">${esc(x.L)}</span><span class="t">${esc(x.t)}</span><span class="c ${n?'on':''}">${n?n+'/':''}${x.items.length}</span></button>`}).join('')}</div>
   <p class="note">${editing?'Editing: tap an item to change it.':'Each + adds one. Tap the picture to fill to the full amount.'}<br><br><button id="editBtn">${editing?'✓ Done editing':'Edit box layout'}</button> · <button id="resetBtn">Clear all checks</button></p></aside>
  <section><div class="sechead"><h2>${esc(b.t)}</h2><span class="cnt">${b.items.length} items</span></div>
  <div class="grid">${b.items.map((it,i)=>{const q=S.sel[it.id]||0,flag=/NO SKU|NOT ON STORE|CHECK/.test(it.status||'');
   return `<div class="card ${q?'sel':''}"><button class="tile" data-i="${i}" aria-label="${esc(it.name)}"><span class="badge">${esc(b.L)}${i+1}</span><span class="fill">${q?q+' / '+it.qty:'fill to '+it.qty}</span>${art(it.art)}</button>
    <div class="meta"><div class="t"><div class="name">${esc(it.name)}</div><div class="pn">${esc(sku(it))}</div>${flag?`<div class="flag">⚠ Confirm SKU</div>`:''}</div>
    <div class="acts">${q&&!editing?`<button class="rnd minus" data-minus="${it.id}" aria-label="Remove one">${ICON.minus}</button>`:''}${nosku(it)?'':`<a class="rnd go" href="${STORE+encodeURIComponent(sku(it))}" target="_blank" rel="noopener" aria-label="Open on webstore">${ICON.go}</a>`}
    ${editing?'':`<button class="rnd add" data-plus="${i}" aria-label="Add one">${ICON.plus}${q?`<span class="q">${q}</span>`:''}</button>`}</div></div></div>`}).join('')}
   ${editing?`<div class="card addnew"><button class="tile" data-add>+ Add item</button></div>`:''}</div></section></div>`;
  if($('allBtn'))$('allBtn').onclick=()=>{const any=b.items.some(it=>S.sel[it.id]);b.items.forEach(it=>{if(any)delete S.sel[it.id];else S.sel[it.id]=it.qty});render();toast(any?'Layer cleared':'Every item filled to its full amount')};
  $('editBtn').onclick=toggleEdit;
  $('resetBtn').onclick=()=>sheet(`<h2>Clear all checks?</h2><p class="sub">Unchecks every item in the ${esc(kit().name)} kit.</p><div class="actions"><button class="btn" data-x>Cancel</button><button class="btn pri" id="cf">Clear</button></div>`,()=>{$('cf').onclick=()=>{kit().boxes.forEach(b=>b.items.forEach(it=>delete S.sel[it.id]));close()}});
}
function render(){
  renderTabs();
  const home=S.view!=='box';
  home?renderHome():renderBox();
  $('tray').hidden=home;
  if(!home){const n=kitSel().length;$('tC').textContent=n;$('sendBtn').disabled=!n||editing;$('prevBtn').disabled=S.box==0;$('nextBtn').disabled=S.box==kit().boxes.length-1}
  save();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-kit],[data-open],[data-b],[data-i],[data-plus],[data-minus],[data-add],[data-home],[data-review]');if(!t)return;
  const d=t.dataset;
  if(d.kit!=null){S.kit=+d.kit;S.box=0;editing=false;go('home');return}
  if(d.home!=null){editing=false;go('home');return}
  if(d.review!=null)return review();
  if(d.open!=null){go('box',+d.open);return}
  if(d.b!=null){go('box',+d.b);return}
  if(d.minus){const id=d.minus;S.sel[id]=(S.sel[id]||0)-1;if(S.sel[id]<=0)delete S.sel[id];render();return}
  if(d.add!=null)return editItem(-1);
  const idx=d.i!=null?+d.i:+d.plus,it=box().items[idx];
  if(editing)return editItem(idx);
  if(d.i!=null&&!S.sel[it.id]){S.sel[it.id]=it.qty;toast('Filled to '+it.qty)}else S.sel[it.id]=(S.sel[it.id]||0)+1;
  render();
});
$('hSend').onclick=review;$('sendBtn').onclick=review;
$('prevBtn').onclick=()=>S.box>0&&go('box',S.box-1);
$('nextBtn').onclick=()=>S.box<kit().boxes.length-1&&go('box',S.box+1);
function toggleEdit(){
  if(editing){editing=false;render();toast('Layout locked');return}
  sheet(`<h2>Unlock editing?</h2><p class="sub">Editing changes which items are in each layer and their fill-to amounts on this device. Type the layer letter <b>${esc(box().L)}</b> to unlock.</p>
  <input class="inp mono" id="code" autocapitalize="characters" autocomplete="off" style="text-align:center;font-size:24px;width:140px"><div class="actions"><button class="btn" data-x>Cancel</button><button class="btn pri" id="ul">Unlock</button></div>`,()=>{
   $('code').focus();$('ul').onclick=()=>{if($('code').value.trim().toUpperCase()==box().L.toUpperCase()){editing=true;close();toast('Editing — tap any item')}else toast('Letter doesn’t match')}})
}
function editItem(i){
  const b=box(),isNew=i<0,it=isNew?{name:'',sku:'',qty:1,min:1,art:'pad'}:b.items[i];
  sheet(`<h2>${isNew?'Add item to '+esc(b.L):'Edit '+esc(b.L)+(i+1)}</h2>
  <p class="sub">Paste the exact Thermal item code from the webstore.</p>
  <label class="f">Thermal item code</label><input class="inp mono" id="eS" value="${esc(it.sku)}" placeholder="e.g. 81037">
  <label class="f">Name</label><input class="inp" id="eN" value="${esc(it.name)}">
  <div class="two"><div><label class="f">Fill to</label><input class="inp" id="eQ" type="number" inputmode="numeric" value="${it.qty}"></div>
  <div><label class="f">Reorder at</label><input class="inp" id="eM" type="number" inputmode="numeric" value="${it.min}"></div></div>
  <div class="actions">${isNew?'':'<button class="btn danger" id="eDel">Remove from box</button>'}<button class="btn" data-x>Cancel</button><button class="btn pri" id="eOk">Save</button></div>`,()=>{
   $('eOk').onclick=()=>{const n=$('eN').value.trim();if(!n)return toast('Name required');
     const o=isNew?{id:uid(),status:'',note:'',art:'pad'}:it;
     Object.assign(o,{name:n,sku:$('eS').value.trim()||n.toUpperCase(),qty:Math.max(1,+$('eQ').value||1),min:Math.max(0,+$('eM').value||0)});
     if(isNew)b.items.push(o);close();toast('Saved')};
   if($('eDel'))$('eDel').onclick=()=>{delete S.sel[it.id];b.items.splice(i,1);close();toast('Removed')};
  });
}
function review(){
  const list=kitSel();if(!list.length)return;
  let html=`<h2>Order list · ${list.length} items</h2><p class="sub">Copy the list and paste it into <b>Add Multiple</b> on the webstore, or open each item. Items with no store SKU are left out of the paste list.</p>`;
  let last=null;
  list.forEach(({b,it,q})=>{
    if(b!==last){html+=`<div class="grp">${esc(b.L)} · ${esc(b.t)}</div>`;last=b}
    html+=`<div class="row"><span class="ic">${art(it.art)}</span><div class="tx"><div class="s">${esc(sku(it))}</div><div class="n">${esc(it.name)}</div></div>
     <span class="stepper"><button data-d="${it.id}" data-v="-1">−</button><input data-q="${it.id}" value="${q}" inputmode="numeric"><button data-d="${it.id}" data-v="1">+</button></span>
     ${nosku(it)?'':`<a href="${STORE+encodeURIComponent(sku(it))}" target="_blank" rel="noopener" data-o="${it.id}" class="${S.opened[it.id]?'vis':''}">${S.opened[it.id]?'Opened ✓':'Open ↗'}</a>`}</div>`});
  html+=`<div class="actions"><button class="btn" data-x>Keep picking</button><button class="btn" id="cp">Copy list</button><a class="btn" style="display:grid;place-items:center;text-decoration:none;color:var(--fg)" href="${TEMPLATE}" target="_blank" rel="noopener">Add Multiple ↗</a><button class="btn pri" id="dn">Done · clear checks</button></div>`;
  sheet(html,()=>{
    $('sheet').onclick=e=>{const d=e.target.closest('[data-d]');if(d){const id=d.dataset.d;S.sel[id]=Math.max(1,(S.sel[id]||1)+ +d.dataset.v);save();d.parentNode.querySelector('input').value=S.sel[id]}
      const o=e.target.closest('[data-o]');if(o){S.opened[o.dataset.o]=1;save();o.classList.add('vis');o.textContent='Opened ✓'}};
    $('sheet').oninput=e=>{const q=e.target.dataset.q;if(q){S.sel[q]=Math.max(1,+e.target.value||1);save()}};
    $('cp').onclick=async()=>{const txt=kitSel().filter(({it})=>!nosku(it)).map(({it,q})=>`${sku(it)},${q}`).join('\n');
      try{await navigator.clipboard.writeText(txt);toast('Copied '+txt.split('\n').length+' lines')}catch(e){toast('Copy was blocked by the browser')}};
    $('dn').onclick=()=>{kit().boxes.forEach(b=>b.items.forEach(it=>{delete S.sel[it.id];delete S.opened[it.id]}));close();go('home');toast('Order done · checks cleared')};
  });
}
function sheet(html,after){$('sheet').innerHTML=html;$('sheet').onclick=null;$('sheet').oninput=null;$('scrim').classList.add('on');after&&after()}
function close(){$('scrim').classList.remove('on');render()}
$('scrim').addEventListener('click',e=>{if(e.target.id=='scrim'||e.target.closest('[data-x]'))close()});
boot();
</script>
</body>
</html>
